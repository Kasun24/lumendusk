name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor declared in pyproject.toml; 3.10 is what Mint 21
        # ships and 3.12 is what Mint 22 ships. 3.10 vs 3.12 also covers both
        # sides of the tomllib split (stdlib from 3.11, `tomli` before that).
        python-version: ["3.9", "3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e '.[sun,dev]'

      - name: Run tests
        run: pytest -q

  lint:
    # Its own job rather than a step inside pytest: lint failures and test
    # failures answer different questions, and a matrix would run the same
    # check three times for one answer. Rules are pinned in pyproject.toml so
    # a ruff release can't fail CI on rules nobody chose.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the linters
        run: pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Lint the shell scripts
        # install.sh and uninstall.sh run on someone else's machine with their
        # $HOME in every path, which is the worst place to find out about an
        # unquoted expansion.
        run: shellcheck install.sh uninstall.sh packaging/*.sh
      - name: Security scan
        # Medium and up. Every call this program makes to gsettings, ddcutil or
        # xrandr is a "low" by construction (B404/B603/B607: subprocess exists,
        # and the binary is found on PATH) — that is what the program *is*, so
        # failing on those would mean disabling the scan within a week.
        run: bandit -q -r src -ll

  applet:
    # The applet is JavaScript run by Cinnamon's GJS, so the Python tests can't
    # see it. A syntax check at least stops a typo reaching someone's panel,
    # where the only symptom is an applet that silently fails to load.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install node
        run: sudo apt-get update && sudo apt-get install -y nodejs
      - name: Check applet syntax
        run: node --check applet/lumendusk@kasun/applet.js
      - name: Check the engine lookup
        run: node tests/applet_engine_resolution.js

  bundle:
    # The applet bundle is what Cinnamon Spices installs: a zip extracted with
    # no installer run, so the engine and its dependencies have to work off a
    # bare python3. Build it and prove it runs in an empty environment — the
    # failure this catches is an applet that installs cleanly and then does
    # nothing at all on someone else's machine.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install gettext
        # For msgfmt, which the Spices validation runs over the translations.
        run: sudo apt-get update && sudo apt-get install -y gettext
      - name: Build the bundle and the Spices tree
        # build-spices.sh builds the bundle itself, then arranges it the way
        # the Spices repository requires and checks it against that repo's
        # rules — so this covers both layouts in one build.
        run: ./packaging/build-spices.sh
      - name: Run the bundled engine with nothing installed
        run: |
          env -i PATH=/usr/bin:/bin HOME="$(mktemp -d)" \
            python3 dist/lumendusk@kasun/engine/run.py status
      - name: Run the engine from inside the Spices tree too
        # Same code, but reached through the path a Spices install actually
        # extracts to — a file left out of the inner directory looks fine in
        # dist/ and breaks only here.
        run: |
          env -i PATH=/usr/bin:/bin HOME="$(mktemp -d)" \
            python3 'dist/spices/lumendusk@kasun/files/lumendusk@kasun/engine/run.py' status
